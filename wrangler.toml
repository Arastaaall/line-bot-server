name = "diet-bot-worker"
main = "index.ts"
compatibility_date = "2024-01-01"

# KV Namespace のバインディング
[[kv_namespaces]]
binding = "DAILY_LIMIT_KV"
id = "449d99f632604fadadf3e638e4cab98f"

# Durable Objects bindings
[[durable_objects.bindings]]
name = "DAILY_LIMIT_DO"
class_name = "DailyLimitCounterV2"

[[durable_objects.bindings]]
name = "CHAT_CONTEXT_DO"
class_name = "ChatContext"

# Migrations
[[migrations]]
tag = "v1"
new_classes = ["DailyLimitCounter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DailyLimitCounterV2", "ChatContext"]

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
